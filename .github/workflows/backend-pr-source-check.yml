name: PR Source Branch Check

on:
  pull_request:
    branches: [main]

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" = "dev" ]; then
            echo "✓ PR source branch is 'dev' — allowed"
          else
            echo "✗ PR source branch is '$HEAD_REF'"
            echo "Only PRs from the 'dev' branch are allowed to merge into 'main'."
            exit 1
          fi
