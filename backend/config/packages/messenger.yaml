framework:
    messenger:
        default_bus: command.bus

        buses:
            command.bus:
                middleware:
                    - validation
                    - doctrine_transaction
            query.bus:
                middleware:
                    - validation
            event.bus:
                middleware:
                    - validation

        # No routing needed - handlers auto-discovered by bus type

        transports:
            sync: 'sync://'
            async: '%env(MESSENGER_TRANSPORT_DSN)%'

        routing:
            'App\Email\Application\Message\SendVerificationEmailMessage': async

when@test:
    framework:
        messenger:
            routing:
                'App\Email\Application\Message\SendVerificationEmailMessage': sync