services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-api_e2e}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailer:
    image: axllent/mailpit
    ports:
      - "8027:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  backend:
    build:
      context: ./backend
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./backend:/app
    working_dir: /app
    environment:
      APP_ENV: test
      DATABASE_URL: "postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-secret}@database:5432/${POSTGRES_DB:-api_e2e}?serverVersion=16&charset=utf8"
      MAILER_DSN: "smtp://mailer:1025"
      MAILER_FROM_EMAIL: "noreply@e2e.test"
      MESSENGER_TRANSPORT_DSN: "sync://"
      OAUTH_PRIVATE_KEY: /app/var/oauth/private.pem
      OAUTH_PUBLIC_KEY: /app/var/oauth/public.pem
      OAUTH_PASSPHRASE: ""
      OAUTH_ENCRYPTION_KEY: ${OAUTH_ENCRYPTION_KEY:-test_encryption_key_32_chars_long}
      OAUTH_DEFAULT_CLIENT_ID: ${OAUTH_DEFAULT_CLIENT_ID:-test_client}
      OAUTH_DEFAULT_CLIENT_SECRET: ${OAUTH_DEFAULT_CLIENT_SECRET:-test_secret}
    command: >
      sh -c "
        composer update symfony/rate-limiter symfonycasts/verify-email-bundle --no-interaction --prefer-dist &&
        mkdir -p var/oauth &&
        ([ -f var/oauth/private.pem ] || openssl genrsa -out var/oauth/private.pem 4096) &&
        ([ -f var/oauth/public.pem ] || openssl rsa -in var/oauth/private.pem -pubout -out var/oauth/public.pem) &&
        php bin/console doctrine:database:create --if-not-exists --env=test &&
        php bin/console doctrine:migrations:migrate --no-interaction --env=test &&
        php -S 0.0.0.0:8080 -t public/
      "
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8080/ && exit 0 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s
    depends_on:
      database:
        condition: service_healthy
      mailer:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.e2e
    working_dir: /app/apps/web
    environment:
      API_URL: http://backend:8080
      NEXTAUTH_SECRET: e2e-test-secret-do-not-use-in-prod
      NEXTAUTH_URL: http://frontend:3000
      OAUTH_CLIENT_ID: ${OAUTH_DEFAULT_CLIENT_ID:-test_client}
      OAUTH_CLIENT_SECRET: ${OAUTH_DEFAULT_CLIENT_SECRET:-test_secret}
    command: pnpm exec next dev --port 3000
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    depends_on:
      backend:
        condition: service_healthy

  playwright:
    build:
      context: ./frontend
      dockerfile: Dockerfile.e2e
    working_dir: /app/apps/web
    environment:
      PLAYWRIGHT_BASE_URL: "http://frontend:3000"
      API_URL: "http://backend:8080"
      API_BASE: "http://backend:8080"
      NEXTAUTH_SECRET: e2e-test-secret-do-not-use-in-prod
      NEXTAUTH_URL: "http://frontend:3000"
      MAILPIT_URL: "http://mailer:8025"
    depends_on:
      frontend:
        condition: service_healthy
      mailer:
        condition: service_started
    command: sh -c "PLAYWRIGHT_BASE_URL=http://frontend:3000 pnpm exec playwright test --grep @email"
